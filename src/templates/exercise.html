{% extends "layout.html" %}

{% block title %}Nota Única{% endblock %}

{% block content %}
    <h2 style="text-align:center;">Que nota é essa?</h2>
    <div style="text-align:center; margin-top:20px;">
        <audio controls autoplay>
            <source src="{{ url_for('static', filename='sounds/' ~ note ~ '.wav') }}" type="audio/wav">
        </audio>
    </div>

    <form method="POST" style="text-align:center; margin-top:20px;">
        <input type="hidden" name="note" value="{{ note }}">
        <input type="text" name="answer" placeholder="Digite sua resposta">
        <button type="submit">Enviar</button>
    </form>

    <p style="text-align:center; margin-top:10px;">{{ message }}</p>
{% endblock %}
